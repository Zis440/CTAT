# Ruff linter configuration for CoreThematics backend
# https://docs.astral.sh/ruff/configuration/

[lint]
# Rules to enable (extend defaults)
select = ["E", "F", "W", "I"]

# Rules to ignore project-wide
ignore = [
    "E501",   # Line too long — many docstrings and data dicts are naturally long
    "F401",   # Unused imports — some are re-exports or used by downstream modules
    "E711",   # Comparison to None — some use `== None` for Pydantic compat
    "E712",   # Comparison to True/False
    "W291",   # Trailing whitespace
    "W292",   # No newline at end of file
    "W293",   # Whitespace before ':'
]

[lint.per-file-ignores]
# __init__.py files often import for re-export
"__init__.py" = ["F401"]
# Test files can have unused imports and assertions
"tests/*" = ["F401", "F811"]
