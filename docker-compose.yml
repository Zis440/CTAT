services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.3.14
    restart: unless-stopped
    volumes:
      - /var/corethematics/model_cache:/root/.ollama
    ports:
      - "11434:11434"           # only needed if you want to call Ollama from outside

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      # Bind mounts → real paths on VPS disk, easy to backup
      - /var/corethematics/uploads:/app/data_store/uploads
      - /var/corethematics/reports:/app/data_store/reports
      - /var/corethematics/sessions:/app/data_store/sessions
      - /var/corethematics/audio_temp:/app/data_store/audio_temp
      - /var/corethematics/saved_learning:/app/saved_learning
      # Static reference data (read-only — already baked into image, but
      # mount here if you want to update cards without rebuilding)
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:              # postgres manages its own data separately